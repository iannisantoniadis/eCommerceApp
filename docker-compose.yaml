      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      keycloak:
        condition: service_healthy
      postgres:
        condition: service_healthy
      zipkin:
        condition: service_healthy
      config-sv:
        condition: service_healthy
      discovery-service:
