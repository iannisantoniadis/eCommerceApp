    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8090/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      keycloak:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      zipkin:
        condition: service_healthy
      redis:
        condition: service_healthy
      config-sv:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    restart: on-failure

  order-service:
