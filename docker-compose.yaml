include:
  - ./docker-compose.infra.yaml

services:
  # JAVA STUFF
  config-sv:
    build:
      context: ./services/config-sv
      dockerfile: Dockerfile
    networks:
      - microservices-net
    environment:
#      - SPRING_PROFILES_ACTIVE=docker
      - KEYCLOAK_REALM=${KEYCLOAK_REALM}
      - SOURCE_FOLDER=docker
      - JAVA_OPTS=-XX:MaxRAMPercentage=75.0 -XX:MinRAMPercentage=50.0
    deploy:
      resources:
        limits:
          memory: 512M # Hard limit (Docker kills it if exceeded)
        reservations:
          memory: 256M # Soft limit (Docker tries to guarantee this)
    env_file:
      - .env
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8888/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      zipkin:
        condition: service_healthy
    restart: on-failure

  discovery-service:
    build:
      context: ./services/discovery
      dockerfile: Dockerfile
    ports:
      - 8761:8761
    env_file:
      - .env
    networks:
      - microservices-net
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - KEYCLOAK_REALM=${KEYCLOAK_REALM}
      - CONFIG_SERVER_URL=config-sv
      - JAVA_OPTS=-XX:MaxRAMPercentage=75.0 -XX:MinRAMPercentage=50.0
    deploy:
      resources:
        limits:
          memory: 512M # Hard limit (Docker kills it if exceeded)
        reservations:
          memory: 256M # Soft limit (Docker tries to guarantee this)
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8761/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      zipkin:
        condition: service_healthy
    restart: on-failure

  customer-service:
    build:
      context: ./services/customer
      dockerfile: Dockerfile
    networks:
      - microservices-net
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - KEYCLOAK_REALM=${KEYCLOAK_REALM}
      - CONFIG_SERVER_URL=config-sv
      - JAVA_OPTS=-XX:MaxRAMPercentage=75.0 -XX:MinRAMPercentage=50.0
    deploy:
      resources:
        limits:
