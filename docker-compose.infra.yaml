services:
  postgres:
    container_name: ms_pg
    image: postgres
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    ports:
      - 5433:5432
    networks:
      - microservices-net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${PG_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5


  pgadmin:
    container_name: ms_pgadmin
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-pgadmin@pgadmin.org}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin:/var/lib/pgadmin
    ports:
      - 5050:80
    networks:
      - microservices-net
    restart: unless-stopped


  mongodb:
    container_name: ms_mongodb
    image: mongo
    ports:
      - 27017:27017
    volumes:
      - mongo:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
    networks:
      - microservices-net
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-express:
    image: mongo-express
    container_name: ms_mongo_express
    restart: unless-stopped
    ports:
      - 8081:8081
    environment:
#      - ME_CONFIG_MONGODB_ADMINUSERNAME=${MONGO_ROOT_USER}
#      - ME_CONFIG_MONGODB_ADMINPASSWORD=${MONGO_ROOT_PASSWORD}
#      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_BASICAUTH_USERNAME=${MONGO_AUTH_USER}
      - ME_CONFIG_BASICAUTH_PASSWORD=${MONGO_AUTH_PASSWORD}
      - ME_CONFIG_MONGODB_ENABLE_ADMIN=true
      - ME_CONFIG_MONGODB_URL=mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/
    networks:
      - microservices-net
    depends_on:
      - mongodb


  mail-dev:
    container_name: ms_mail_dev
    image: maildev/maildev
    ports:
      - 1080:1080
      - 1025:1025
    healthcheck:
      test: ["CMD-SHELL", "wget -O - http://localhost:1080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - microservices-net

  kafka:
    image: apache/kafka:4.1.1
    ports:
      - 9092:9092
    environment:
      # Use KRaft mode (no Zookeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # 1. Listen on all interfaces inside the container
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      # 2. Tell the Host to use localhost, and Docker to use 'kafka'
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # 3. Security mapping
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
    volumes:
      - kafka:/apache/kafka
    networks:
      - microservices-net
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list" ]
      interval: 10s
      timeout: 10s
      retries: 5

  zipkin:
    image: openzipkin/zipkin
    container_name: zipkin
    ports:
      - 9411:9411
    environment:
      - STORAGE_TYPE=mem
    networks:
      - microservices-net
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "9411" ]
      interval: 5s
      retries: 5
      start_period: 15s

  keycloak:
    container_name: keycloak-ms
    image: quay.io/keycloak/keycloak:24.0.2
    ports:
      - 8080:8080
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      # because we want all jwt to be signed by what the gateway perceives as "keycloak"
#      KC_HOSTNAME_URL: http://keycloak:8080
#      KC_HOSTNAME: keycloak
#      KC_HOSTNAME_PORT: 8080
#      because the header will most likely be localhost:9098 as it is exposed,
#        in which case it does not match keycloak:8080 => it is seen as forgery
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
      KC_DB_USERNAME: ${PG_USER}
      KC_DB_PASSWORD: ${PG_PASSWORD}
      KC_HEALTH_ENABLED: true
      KC_IMPORT: /opt/keycloak/data/import
    command:
      - start-dev
      - --import-realm
      - --hostname-url=http://keycloak:8080
      - --hostname-admin-url=http://keycloak:8080
    volumes:
      - keycloak:/opt/keycloak/data
#      FROM FOLDER : TO FOLDER : READ ONLY
#      - ./keycloak_stuff/realm_export.json:/opt/keycloak/data/import/realm_export.json:ro
      - ./keycloak_stuff:/opt/keycloak/data/import
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'" ]
      interval: 30s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - microservices-net

  redis:
    container_name: redis
    image: redis:7.2-alpine
    ports:
      - 6379:6379
    volumes:
      - redis:/data
    networks:
      - microservices-net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes
    # enables persistence - the cache survives restarts, alpine makes it lightweight

  redis-commander:
    container_name: redis_commander
    image: rediscommander/redis-commander
    ports:
      - 8085:8081
    environment:
      - REDIS_HOSTS=local:redis:6379
    networks:
      - microservices-net
    depends_on:
      - redis
    restart: unless-stopped

  prometheus:
    container_name: prometheus
    image: prom/prometheus:latest
    ports:
      - 9090:9090
    volumes:
#      PICK EITHER DEV OR DOCKER MODE, AS TARGETS POINT TO EITHER LOCALHOST (host.docker.internal) OR CONTAINER NAME
#      DEV MODE
#      - ./prometheus/prometheus_dev.yml:/etc/prometheus/prometheus.yml
#      DOCKER MODE
      - ./prometheus/prometheus_docker.yml:/etc/prometheus/prometheus.yml
      - prometheus:/prometheus

    networks:
      - microservices-net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy" ]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    container_name: grafana
    image: grafana/grafana:latest
    ports:
      - 3000:3000
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - microservices-net
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy

networks:
  microservices-net:
    name: microservices-net
    driver: bridge

volumes:
  postgres:
  pgadmin:
  mongo:
  kafka:
  keycloak:
  redis:
  prometheus:
  grafana:

