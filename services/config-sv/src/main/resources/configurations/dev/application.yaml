eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/


# To check whether the service is up by accessing the actuator
management:
  endpoints:
    web:
      exposure:
        include: health


spring:
  cloud:
    config:
      override.system-properties: false

app:
  keycloak:
    realm: micro-services-api

