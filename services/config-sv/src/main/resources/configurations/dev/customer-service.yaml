spring:
  mongodb:
    username: ${MONGO_ROOT_USER}
    password: ${MONGO_ROOT_PASSWORD}
    host: localhost
    port: 27017
    database: customer
    authentication-database: admin
  data:
    mongodb:
      auto-index-creation: true
    redis:
      host: localhost
      port: 6379
    cache:
      type: redis
      redis:
        time-to-live: 600000        # 10 minutes
        cache-null-values: false

server:
  port: 8090
  forward-headers-strategy: framework