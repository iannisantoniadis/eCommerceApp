server:
  port:
    8222

spring:
  cloud:
    gateway:
      server:
        webflux:
          discovery:
              lower-case-service-id: true
          routes:
            - id: customer-service
              uri: lb://customer-service
              predicates:
                - Path=/api/v1/customers/**, /customer-service/**
              filters:
                - TokenRelay=
                #Se scoate prima bucata din url - /customer-service si se trimite doar /api/v3/api-docs mai departe catre service
                - RewritePath=/customer-service/(?<segment>.*), /$\{segment}
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/v1/orders/**, /order-service/**
              filters:
                - TokenRelay=
                - RewritePath=/order-service/(?<segment>.*), /$\{segment}
            - id: order-lines-service
              uri: lb://order-service
              predicates:
                - Path=/api/v1/order-lines/**
              filters:
                - TokenRelay=
            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/api/v1/products/**, /product-service/**
              filters:
                - TokenRelay=
                - RewritePath=/product-service/(?<segment>.*), /$\{segment}
            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/v1/payments/**, /payment-service/**
              filters:
                - TokenRelay=
                - RewritePath=/payment-service/(?<segment>.*), /$\{segment}

  # To know where to validate JWT
  security:
    oauth2:
      resourceserver:
        jwt:
          # Use the container name 'keycloak-ms' as defined in your docker-compose
          issuer-uri: http://keycloak:8080/realms/${KEYCLOAK_REALM}
          # Jars might need this if they can't reach the issuer during startup
          jwk-set-uri: http://keycloak:8080/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs
#eureka:
#  client:
#    service-url:
#      defaultZone: http://localhost:8761/eureka/

management:
#  tracing:
#    sampling:
#      probability: 1.0
#    export:
#      zipkin:
#        endpoint: http://zipkin:9411/api/v2/spans
  endpoints:
    web:
      exposure:
        include: "gateway,health"
  endpoint:
    gateway:
      access: read_only

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.cloud.gateway: TRACE

springdoc:
#  enable-native-support: true
#  swagger-ui:
#    path: /swagger-ui.html
#    enabled: true
#    config-url: /v3/api-docs/swagger-config
#    urls-primary-name: E-Commerce App
  enable-native-support: true
  show-common-extensions: true
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    disable-swagger-default-url: true
    path: /swagger-ui.html
    enabled: true
    config-url: /v3/api-docs/swagger-config
    urls-primary-name: E-Commerce App
    servers:
      - url: http://localhost:8222
        description: API Gateway
    oauth2-redirect-url: http://localhost:8222/swagger-ui/oauth2-redirect.html
    oauth:
      client_id: micro-services-api
      use-pkce-with-authorization-code-grant: true
      scopes: "openid profile"

    urls:
      - name: Order Service
        url: /order-service/v3/api-docs
      - name: Product Service
        url: /product-service/v3/api-docs
      - name: Customer Service
        url: /customer-service/v3/api-docs
      - name: Payment Service
        url: /payment-service/v3/api-docs
