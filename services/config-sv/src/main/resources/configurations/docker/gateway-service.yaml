server:
  port:
    8222

spring:
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: customer-service
              uri: lb://CUSTOMER-SERVICE
              predicates:
                - Path=/api/v1/customers/**
              filters:
                - TokenRelay=
            - id: order-service
              uri: lb://ORDER-SERVICE
              predicates:
                - Path=/api/v1/orders/**
              filters:
                - TokenRelay=
            - id: order-lines-service
              uri: lb://ORDER-SERVICE
              predicates:
                - Path=/api/v1/order-lines/**
              filters:
                - TokenRelay=
            - id: products-service
              uri: lb://PRODUCT-SERVICE
              predicates:
                - Path=/api/v1/products/**
              filters:
                - TokenRelay=
            - id: payment-service
              uri: lb://PAYMENT-SERVICE
              predicates:
                - Path=/api/v1/payments/**
              filters:
                - TokenRelay=

  # To know where to validate JWT
  security:
    oauth2:
      resourceserver:
        jwt:
          # Use the container name 'keycloak-ms' as defined in your docker-compose
          issuer-uri: http://localhost:9098/realms/${KEYCLOAK_REALM}
          # Jars might need this if they can't reach the issuer during startup
          jwk-set-uri: http://localhost:9098/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs
#eureka:
#  client:
#    service-url:
#      defaultZone: http://localhost:8761/eureka/

management:
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        endpoint: zipkin:9411/api/v2/spans
  endpoints:
    web:
      exposure:
        include: "gateway"
  endpoint:
    gateway:
      access: read_only

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.cloud.gateway: TRACE

springdoc:
#  enable-native-support: true
#  swagger-ui:
#    path: /swagger-ui.html
#    enabled: true
#    config-url: /v3/api-docs/swagger-config
#    urls-primary-name: E-Commerce App
  enable-native-support: true
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    config-url: /v3/api-docs/swagger-config
    urls-primary-name: E-Commerce App

    urls:
      - name: Order Service
        url: order-service:8070/v3/api-docs
      - name: Product Service
        url: product-service:8050/v3/api-docs
      - name: Customer Service
        url: customer-service:8090/v3/api-docs
      - name: Payment Service
        url: payment-service:8060/v3/api-docs
