eureka:
  instance:
    hostname: discovery-service
  client:
#    register-with-eureka: false
#    fetch-registry: false
    service-url:
      defaultZone: http://discovery-service:8761/eureka/


# To check whether the service is up by accessing the actuator
management:
  endpoints:
    web:
      exposure:
        include: health

spring:
  cloud:
    config:
      override.system-properties: false

app:
  keycloak:
    realm: micro-services-api

