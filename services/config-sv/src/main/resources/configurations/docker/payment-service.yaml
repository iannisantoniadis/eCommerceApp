spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/payments
    username: ${PG_USER}
    password: ${PG_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: HikariPool-payment-service
  jpa:
    hibernate:
      ddl-auto: validate
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    baseline-on-migrate: true
    enabled: true
    baseline-description: "init"
    baseline-version: 1
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
  kafka:
    bootstrap-servers: kafka:29092
    listener:
      ack-mode: manual_immediate
    template:
      order-topic: order-topic
      payment-topic: payment-topic
      payment-success-topic: payment-success-topic
      payment-failure-topic: payment-failure-topic
      payment-notification-topic: payment-notification-topic
    producer:
      bootstrap-servers: kafka:29092
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: paymentEvent:com.example.ecomerce.kafka.payment.PaymentEvent
    consumer:
      # in order for Kafka to not commit an offset before the transactional write to DB of the requests finishes
      enable-auto-commit: false
      #      group-id: orderGroup
      auto-offset-reset: earliest
      bootstrap-servers: kafka:29092
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        # inner deserializer that does the actual work
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        #        Tells the consumer what kind of object it should expect, where the obj is coming from, what object to trust / consume
        spring.json.type.mapping: paymentEvent:com.example.ecomerce.kafka.payment.PaymentEvent
        spring.json.trusted.packages: '*'

  # To know where to validate JWT
  security:
    oauth2:
      resourceserver:
        jwt:
          # Use the container name
          issuer-uri: http://keycloak:8080/realms/${KEYCLOAK_REALM}
          # Jars might need this if they can't reach the issuer during startup
          jwk-set-uri: http://keycloak:8080/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs
server:
  port: 8060
  forward-headers-strategy: framework